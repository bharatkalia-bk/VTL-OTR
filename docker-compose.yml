# VTL OTR local stack: docker compose up --build
# Candidate portal http://localhost:5173 · Admin http://localhost:5174 · API docs http://localhost:4000/api/docs
# Mailpit http://localhost:8025 · MinIO console http://localhost:9001
name: vtl-otr

x-api-env: &api-env
  NODE_ENV: development
  PORT: 4000
  PUBLIC_API_URL: http://localhost:5173
  CANDIDATE_WEB_URL: http://localhost:5173
  ADMIN_WEB_URL: http://localhost:5174
  CORS_ORIGINS: http://localhost:5173,http://localhost:5174
  DATABASE_URL: postgresql://vtl:vtl@postgres:5432/vtl_otr?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-000000000}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-00000000}
  PII_ENC_KEY: ${PII_ENC_KEY:-ZGV2LW9ubHktcGlpLWVuYy1rZXktMzItYnl0ZXMhISE=}
  PII_INDEX_KEY: ${PII_INDEX_KEY:-ZGV2LW9ubHktcGlpLWlkeC1rZXktMzItYnl0ZXMhISE=}
  FILE_URL_SECRET: ${FILE_URL_SECRET:-dev-only-file-url-secret-change-me-0000000}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_BUCKET: vtl-otr
  S3_ACCESS_KEY: vtl-minio
  S3_SECRET_KEY: vtl-minio-secret
  EMAIL_DRIVER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  DEV_EXPOSE_SECRETS: "true"
  SWAGGER_ENABLED: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vtl, POSTGRES_PASSWORD: vtl, POSTGRES_DB: vtl_otr }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vtl"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: vtl-minio, MINIO_ROOT_PASSWORD: vtl-minio-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 10 }

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment: *api-env
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, minio: { condition: service_healthy } }

  worker:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["node", "dist/src/worker.js"]
    environment: *api-env
    depends_on: [api]

  seed:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed/index.js"]
    environment: *api-env
    depends_on: { postgres: { condition: service_healthy }, minio: { condition: service_healthy } }
    profiles: ["seed"]

  candidate-web:
    build: { context: ., dockerfile: docker/web.Dockerfile, args: { APP: candidate-web } }
    ports: ["5173:80"]
    depends_on: [api]

  admin-web:
    build: { context: ., dockerfile: docker/web.Dockerfile, args: { APP: admin-web } }
    ports: ["5174:80"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
