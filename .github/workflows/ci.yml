name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vtl, POSTGRES_PASSWORD: vtl, POSTGRES_DB: vtl_otr_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vtl -d vtl_otr_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vtl/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node scripts/check-i18n.mjs apps/candidate-web
      # Chromium is needed by the API tests too (server-side PDFs), so install it before any tests.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/candidate-web
      - run: pnpm test
      - run: pnpm --filter @vtl/candidate-web build && pnpm --filter @vtl/admin-web build
      # numpy + Pillow build the fake-camera face clip for the live-photo E2E test
      - run: python3 -m pip install --user numpy pillow
      - run: pnpm test:e2e
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/candidate-web/test-results
          retention-days: 7
